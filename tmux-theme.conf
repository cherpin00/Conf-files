# ============================================================================
# tmux-theme.conf -- appearance only. Sourced from tmux.conf.
#
# Nothing in this file changes how tmux BEHAVES; it only changes how it looks.
# If the bar ever breaks, comment out the source line in tmux.conf and you are
# back to stock tmux with your normal keybindings intact.
#
# To reskin: edit the palette block below. Everything else references it.
# To drop Nerd Font glyphs: blank out the @g_* values.
# ============================================================================

# --- palette: Catppuccin Mocha ---------------------------------------------
set -g @base     "#1e1e2e"
set -g @mantle   "#181825"
set -g @surface0 "#313244"
set -g @surface1 "#45475a"
set -g @overlay0 "#6c7086"
set -g @subtext0 "#a6adc8"
set -g @text     "#cdd6f4"
set -g @mauve    "#cba6f7"
set -g @blue     "#89b4fa"
set -g @green    "#a6e3a1"
set -g @peach    "#fab387"
set -g @red      "#f38ba8"
set -g @yellow   "#f9e2af"

# --- ANSI palette: make the theme independent of the terminal emulator ------
# Without this, anything inside a pane that asks for "red" or "blue" -- ls,
# grep, starship, vim's 16-colour fallbacks -- resolves against whatever
# palette the terminal emulator happens to have. That ties your look to a
# per-machine iTerm/Alacritty/Ghostty profile.
#
# pane-colours overrides those indices inside tmux, so the theme travels with
# the devserver instead of the laptop. Only 0-15 need overriding: indices
# 16-255 are the standardised xterm cube and are already identical everywhere.
#
# These take a bare colour and do NOT expand formats, so the palette is inlined.
setw -g pane-colours[0]  "#45475a"   # black          (surface1)
setw -g pane-colours[1]  "#f38ba8"   # red
setw -g pane-colours[2]  "#a6e3a1"   # green
setw -g pane-colours[3]  "#f9e2af"   # yellow
setw -g pane-colours[4]  "#89b4fa"   # blue
setw -g pane-colours[5]  "#f5c2e7"   # magenta        (pink)
setw -g pane-colours[6]  "#94e2d5"   # cyan           (teal)
setw -g pane-colours[7]  "#bac2de"   # white          (subtext1)
setw -g pane-colours[8]  "#585b70"   # bright black   (surface2)
setw -g pane-colours[9]  "#f38ba8"   # bright red
setw -g pane-colours[10] "#a6e3a1"   # bright green
setw -g pane-colours[11] "#f9e2af"   # bright yellow
setw -g pane-colours[12] "#89b4fa"   # bright blue
setw -g pane-colours[13] "#f5c2e7"   # bright magenta
setw -g pane-colours[14] "#94e2d5"   # bright cyan
setw -g pane-colours[15] "#a6adc8"   # bright white   (subtext0)

# --- Nerd Font glyphs (powerline-extra round caps + icons) ------------------
set -g @g_lcap   ""
set -g @g_rcap   ""
set -g @g_host   ""
set -g @g_clock  ""
set -g @g_zoom   ""

# --- the spare command line -------------------------------------------------
# tmux always draws the command prompt over the status-left region of status
# line 0, which wipes out the session pill every time you type `prefix :`.
# Fix: a second, blank status line, with message-line pointing the prompt at
# it. status-format[0] is deliberately left at its built-in default so the
# window list keeps its mouse click-to-select ranges.
# Costs one terminal row. Delete these three lines to get it back.
set -g status 2
set -g status-format[1] "#[bg=default]"
set -g message-line 1

# --- bar geometry -----------------------------------------------------------
set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=#{@base},fg=#{@text}"
set -g status-left-length 60
set -g status-right-length 120

# --- left: session pill -----------------------------------------------------
# Turns peach the moment the prefix is held, so the modal state of the terminal
# is always visible instead of guessed at.
set -g status-left "\
#[fg=#{?client_prefix,#{@peach},#{@blue}},bg=#{@base}]#{@g_lcap}\
#[fg=#{@base},bg=#{?client_prefix,#{@peach},#{@blue}},bold] #S \
#[fg=#{?client_prefix,#{@peach},#{@blue}},bg=#{@base},nobold]#{@g_rcap} "

# --- centre: window list ----------------------------------------------------
# Inactive windows are plain text; only the active one gets a pill. Keeps a
# ten-window session from turning into a wall of boxes.
set -g window-status-separator ""

set -g window-status-format "\
#[fg=#{@base},bg=#{@base}] \
#[fg=#{@overlay0}]#I#[fg=#{@overlay0}]:#[fg=#{@subtext0}]#W\
#[fg=#{@base}] "

set -g window-status-current-format "\
#[fg=#{@surface1},bg=#{@base}]#{@g_lcap}\
#[fg=#{@mauve},bg=#{@surface1},bold]#I#[fg=#{@overlay0},nobold]:#[fg=#{@text},bold]#W\
#{?window_zoomed_flag,#[fg=#{@peach}] #{@g_zoom},}\
#[fg=#{@surface1},bg=#{@base},nobold]#{@g_rcap} "

set -g window-status-activity-style "fg=#{@yellow},bg=#{@base}"
set -g window-status-bell-style "fg=#{@red},bg=#{@base},bold"

# --- right: one continuous tray, rounded at the outer edges only ------------
# Each #() script emits its OWN trailing separator, or nothing at all when it
# has nothing to say (outside a repo, no kubeconfig). tmux formats cannot branch
# on the output of #(), so the collapsing has to happen inside the scripts --
# that is what keeps the tray free of dangling dividers.
# Drop either #() line to remove that segment entirely.
set -g status-right "\
#[fg=#{@surface0},bg=#{@base}]#{@g_lcap}\
#[bg=#{@surface0}] \
#(~/.tmux-scripts/scm-status.sh '#{pane_current_path}')\
#(~/.tmux-scripts/k8s-status.sh)\
#[fg=#{@blue}]#{@g_host} #[fg=#{@text}]#h \
#[fg=#{@overlay0}]│ \
#[fg=#{@mauve}]#{@g_clock} #[fg=#{@text}]%H:%M \
#[fg=#{@surface0},bg=#{@base}]#{@g_rcap}"

# --- panes ------------------------------------------------------------------
# tmux has no padding or gap concept: the layout is a strict character grid and
# every border is exactly one column wide (`padded` and `rounded` are rejected
# values for pane-border-lines). Two tricks get close to the look of gaps:
#
# 1. Colour the border the same as the inactive pane background, so the border
#    column reads as empty space. Only the focused pane keeps a mauve ring.
set -g pane-border-lines single
set -g pane-border-style "fg=#{@mantle},bg=#{@mantle}"
set -g pane-active-border-style "fg=#{@mauve},bg=#{@mantle}"

# 2. Give inactive panes a darker background so panes read as separate surfaces.
#    CAVEATS, both real: this forces a background colour onto pane content, so
#    (a) terminal transparency is lost, and (b) full-screen TUIs such as vim,
#    htop and coloured less paint their own background and ignore it, which can
#    look inconsistent when one pane has vim open and another is a plain shell.
#    Delete these two lines to keep the gap illusion without the dimming.
#    fg is set too, so the default text colour is tmux's rather than the
#    terminal's -- the other half of not depending on an emulator profile.
set -g window-style "fg=#{@subtext0},bg=#{@mantle}"
set -g window-active-style "fg=#{@text},bg=#{@base}"

# --- messages, copy mode, popups --------------------------------------------
set -g message-style "fg=#{@base},bg=#{@peach},bold"
set -g message-command-style "fg=#{@text},bg=#{@surface0}"
set -g mode-style "fg=#{@base},bg=#{@mauve},bold"
set -g copy-mode-match-style "fg=#{@base},bg=#{@yellow}"
set -g copy-mode-current-match-style "fg=#{@base},bg=#{@peach},bold"

set -g popup-style "fg=#{@text},bg=#{@mantle}"
set -g popup-border-style "fg=#{@mauve}"
set -g popup-border-lines rounded

# NB: unlike the *-style options above, these take a bare colour and do NOT
# expand formats, so the palette has to be inlined here.
set -g clock-mode-colour "#cba6f7"
set -g display-panes-colour "#45475a"
set -g display-panes-active-colour "#cba6f7"
