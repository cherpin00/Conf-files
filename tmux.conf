# ============================================================================
# Layout: this file is behaviour, tmux-theme.conf is appearance. If the bar
# ever misbehaves, comment out the `source-file` line for the theme and you are
# back to plain tmux with every keybinding below still working.
#
# Do not edit this file while iterating -- `tmux-preview` runs a throwaway tmux
# server against the gitignored .dev.conf twin of this file, and
# `tmux-preview promote` copies that twin over this one.
#
# Paths below point at $HOME symlinks (~/.tmux-theme.conf, ~/.tmux-scripts),
# created by install.sh, so this config does not care where the repo is cloned.
# ============================================================================

# C-b is not acceptable -- Vim uses it
set-option -g prefix C-q

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

#Allow mouse to do things like scroll
set -g mouse on

#Change how viewers screens are resized
setw -g aggressive-resize off

# Start numbering at 1
set -g base-index 1

# Don't wait for a key after escape
set-option -g escape-time 0

# Increase buffer scrollback length
set-option -g history-limit 10000

# Navigate visual mode with vim keys
setw -g mode-keys vi

# Don't detach when we kill a session
set -g detach-on-destroy off

# --------------------------------------------------------------------------
# Required for the theme to render correctly
# --------------------------------------------------------------------------
# Replaces `default-terminal "screen-256color"`. tmux-256color is the correct
# terminfo for tmux itself (verified present on this host), and the RGB feature
# is what actually unlocks the 24-bit colours the theme uses. Without these the
# palette degrades to the nearest 256-colour approximation.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"

# --------------------------------------------------------------------------
# Optional quality-of-life -- safe to delete, nothing else depends on them
# --------------------------------------------------------------------------
# Let vim/nvim see focus gain/loss (autoread, cursor shape restore).
set -g focus-events on
# Make tmux emit OSC 52 itself, so copying inside tmux reaches the clipboard of
# whatever machine you are attached from.
set -g set-clipboard on

# Resize with Alt+Shift+HJKL, no prefix -- mirrors the M-hjkl pane nav above.
# Deliberately NOT prefix+HJKL: prefix L is already switch-client -l.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Reload. Capital R, because lowercase r is refresh-client.
# NOT "#{config_files}": on a normal server that format expands to the whole
# comma-separated SEARCH LIST (/etc/tmux.conf,~/.tmux.conf,...), which
# source-file would then treat as one filename. Hard-code the real path.
# The preview guard at the bottom points this at the dev file instead.
bind R source-file ~/.tmux.conf \; display-message " config reloaded"

# New window inherits the current directory, matching the | and - splits above.
bind c new-window -c "#{pane_current_path}"

# vim-style select/yank in copy mode. NOTE this REPURPOSES v, which stock tmux
# binds to rectangle-toggle -- nothing is lost, stock tmux binds C-v to
# rectangle-toggle as well.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --------------------------------------------------------------------------
# Scratchpad -- github.com/cherpin00/tmux-scratchpad (local clone)
# --------------------------------------------------------------------------
#   prefix u  toggle a persistent popup shell. The same key dismisses it, with
#             everything inside still running; `exit` is the reset.
# Tabs along the top of the popup, in this theme's colours -- window-status-*
# are global window options, so the plugin gets them for free.
run-shell "~/code/tmux-scratchpad/scratchpad.tmux"

# --------------------------------------------------------------------------
# Appearance
# --------------------------------------------------------------------------
source-file ~/.tmux-theme.conf

# --------------------------------------------------------------------------
# Agent sidebar -- github.com/cherpin00/tmux-agent-sidebar (local clone)
# --------------------------------------------------------------------------
#   prefix e  toggle a pane listing every running agent and what it is doing
#   prefix S  fzf popup, jump straight to any agent's pane
# The entry point binds the keys itself, so this path is the only coupling.
run-shell "~/code/tmux-agent-sidebar/agent-sidebar.tmux"

# --------------------------------------------------------------------------
# Worktrees -- github.com/cherpin00/tmux-worktree (local clone)
# --------------------------------------------------------------------------
#   prefix W  picker: type a name + ^N to carve a worktree of the repo the
#             current pane is in, enter to jump to one, ^X to delete one
# prefix w is left alone deliberately -- that is tmux's own choose-tree.
run-shell "~/code/tmux-worktree/worktree.tmux"

# --------------------------------------------------------------------------
# Plugins
# --------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Continuum was already saving every 15 min to ~/.local/share/tmux/resurrect/,
# but nothing ever restored it -- after a devserver reboot you had to hit
# `prefix Ctrl-r` by hand. This closes that. Delete if you prefer manual.
set -g @continuum-restore 'on'

# --------------------------------------------------------------------------
# Preview-server guard -- MUST be the last thing before tpm runs
# --------------------------------------------------------------------------
# When running under `tmux-preview` (socket "uidev"), keep the throwaway server
# from stomping on the real one. Position matters twice over: it has to come
# after every setting it overrides (including the @continuum-* options just
# above), and before tpm so resurrect reads the overridden values.
#   - different prefix, so a preview nested inside your real tmux doesn't fight
#     it for C-q
#   - resurrect writes to a scratch dir, with continuum autosave and autorestore
#     both off, so the preview's throwaway windows can never overwrite or
#     resurrect over your real saved state
%if "#{m:*uidev*,#{socket_path}}"
    set -g prefix C-a
    unbind C-q
    bind C-a send-prefix
    set -g @resurrect-dir '~/.tmux/resurrect-preview'
    set -g @continuum-save-interval '0'
    set -g @continuum-restore 'off'
    # Here #{config_files} IS a single path, because tmux-preview passes -f.
    bind R source-file -F "#{config_files}" \; display-message " config reloaded"
%endif

run '~/.tmux/plugins/tpm/tpm'
